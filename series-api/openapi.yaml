openapi: 3.1.0
info:
  title: Series Tracker API
  description: API REST para gestionar tu lista de series
  version: 1.0.0

paths:
  /series:
    get:
      tags: [series]
      summary: List Series
      operationId: list_series_series_get
      parameters:
        - name: page
          in: query
          required: false
          schema: { type: integer, minimum: 1, default: 1 }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 10 }
        - name: q
          in: query
          required: false
          schema: { type: string, default: "" }
        - name: sort
          in: query
          required: false
          schema: { type: string, default: created_at }
        - name: order
          in: query
          required: false
          schema: { type: string, default: desc }
      responses:
        "200":
          description: Lista paginada de series
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Series" }
                  page: { type: integer }
                  limit: { type: integer }
                  total_count: { type: integer }
                  total_pages: { type: integer }

    post:
      tags: [series]
      summary: Create Series
      operationId: create_series_series_post
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SeriesCreate" }
      responses:
        "201":
          description: Serie creada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Series" }
        "400":
          description: Input inválido
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HTTPValidationError" }

  /series/{series_id}:
    get:
      tags: [series]
      summary: Get Series
      operationId: get_series_series__series_id__get
      parameters:
        - name: series_id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Serie encontrada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Series" }
        "404":
          description: Serie no encontrada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

    put:
      tags: [series]
      summary: Update Series
      operationId: update_series_series__series_id__put
      parameters:
        - name: series_id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SeriesUpdate" }
      responses:
        "200":
          description: Serie actualizada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Series" }
        "404":
          description: Serie no encontrada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

    delete:
      tags: [series]
      summary: Delete Series
      operationId: delete_series_series__series_id__delete
      parameters:
        - name: series_id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "204":
          description: Serie eliminada
        "404":
          description: Serie no encontrada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /series/{series_id}/rating:
    post:
      tags: [ratings]
      summary: Add Rating
      operationId: add_rating_series__series_id__rating_post
      parameters:
        - name: series_id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RatingCreate" }
      responses:
        "201":
          description: Rating creado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Rating" }
        "404":
          description: Serie no encontrada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

    get:
      tags: [ratings]
      summary: Get Ratings
      operationId: get_ratings_series__series_id__rating_get
      parameters:
        - name: series_id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Lista de ratings
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Rating" }
        "404":
          description: Serie no encontrada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /upload:
    post:
      tags: [upload]
      summary: Upload Image
      operationId: upload_image_upload_post
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "201":
          description: Imagen subida exitosamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  image_path: { type: string, example: "https://res.cloudinary.com/..." }
        "400":
          description: Archivo inválido o muy grande
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

components:
  schemas:
    Series:
      type: object
      properties:
        id: { type: integer }
        title: { type: string }
        genre: { type: string, nullable: true }
        status: { type: string, enum: [pendiente, viendo, completada, abandonada] }
        synopsis: { type: string, nullable: true }
        year: { type: integer, nullable: true }
        image_path: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    SeriesCreate:
      type: object
      required: [title]
      properties:
        title: { type: string, minLength: 1, maxLength: 255 }
        genre: { type: string, nullable: true }
        status: { type: string, default: pendiente, enum: [pendiente, viendo, completada, abandonada] }
        synopsis: { type: string, nullable: true }
        year: { type: integer, minimum: 1900, maximum: 2100, nullable: true }
        image_path: { type: string, nullable: true }

    SeriesUpdate:
      type: object
      properties:
        title: { type: string, minLength: 1, maxLength: 255, nullable: true }
        genre: { type: string, nullable: true }
        status: { type: string, nullable: true, enum: [pendiente, viendo, completada, abandonada] }
        synopsis: { type: string, nullable: true }
        year: { type: integer, minimum: 1900, maximum: 2100, nullable: true }
        image_path: { type: string, nullable: true }

    RatingCreate:
      type: object
      required: [score]
      properties:
        score: { type: number, minimum: 0, maximum: 10 }
        review: { type: string, nullable: true }

    Rating:
      type: object
      properties:
        id: { type: integer }
        series_id: { type: integer }
        score: { type: number }
        review: { type: string, nullable: true }
        rated_at: { type: string, format: date-time }

    Error:
      type: object
      properties:
        detail: { type: string }

    HTTPValidationError:
      type: object
      properties:
        detail:
          type: array
          items:
            type: object
            properties:
              loc:
                type: array
                items: { anyOf: [{ type: string }, { type: integer }] }
              msg: { type: string }
              type: { type: string }